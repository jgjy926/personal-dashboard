name: Refresh feeds & deploy

# Runs the data fetchers on GitHub's runners (clean egress — FRED/Public Bank work
# here even where a local sandbox is blocked), commits the refreshed public feeds,
# and publishes the static dashboard to GitHub Pages. Entirely on free tiers.
#
# The Macro tab is driven by the sibling macro forecasting engine, which is
# checked out alongside this repo and run here daily. Two things make that cheap:
#
#   * The runner keeps a LIGHT database — observations only, ~55MB — in the
#     Actions cache. The 1.2M-row ALFRED vintage store (160MB of a 214MB full
#     database) is needed only to PRODUCE a backtest, never to display one, so it
#     is deliberately absent here.
#   * The backtest itself runs on your own machine when you want it
#     (`python main.py monthly`), and exports a ~25KB data/backtest_result.json
#     that IS committed. The engine reads that when the database has no summary,
#     so the published Model Performance page stays complete.
#
# TWO SPEEDS. A push (a code change, or the Console publishing promo summaries)
# only needs the site rebuilt, so it runs the FAST path: the stdlib-only macro +
# Treasury fetchers and the deploy, ~1-1.5 min. The daily schedule and a manual
# run take the FULL path: promo scrape, summariser and the macro engine too.
#
# The engine's monthly model refit (~4-5 min) is kept OUT of the deploy path:
# the daily run scores with last month's fit (MACRO_ALLOW_STALE_MODEL, flagged on
# the feed as meta.model_stale_from) and the `retrain` job below refits after the
# site is already live, then redeploys.

on:
  workflow_dispatch:            # run manually from the Actions tab (full path)
  push:
    branches: [main]            # fast path
  schedule:
    - cron: "20 6 * * *"        # daily 06:20 UTC (after US markets settle), full path

permissions:
  contents: write               # commit refreshed feeds back
  pages: write                  # deploy to Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # true on schedule / manual runs; false on push.
  FULL: ${{ github.event_name != 'push' }}

jobs:
  # Deliberately a SEPARATE job, and deliberately not a dependency of the deploy
  # below. It guards the parse/merge layer the macro cards are built from — no
  # network, ~1s — and it is where the staleness bugs lived (UTC-vs-exchange
  # dating, the Reiwa-only era pattern, splicing a fast source onto a slow one).
  #
  # It does not gate the deploy for the same reason every step below carries
  # continue-on-error: one broken source must never stop the other feeds from
  # refreshing or the site from publishing. A red X here is a clear signal to fix
  # the parser; meanwhile fetch_macro.py's own "no series returned — refusing to
  # overwrite" guard is what actually protects the published feed from garbage.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p 'test_*.py' -v

  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      needs_retrain: ${{ steps.engine.outputs.needs_retrain }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Wheels for the promo tools AND the engine (pandas, scikit-learn…)
          # land in the one pip cache, so neither re-downloads them each run.
          # The fast path installs nothing, so it skips the cache entirely.
          cache: ${{ env.FULL == 'true' && 'pip' || '' }}
          cache-dependency-path: tools/requirements-ci.txt

      - name: Fetch macro (FRED + Treasury + Yahoo + Japan MoF + NY Fed SRF, all keyless)
        # Matches every step below: one bad source must not stop the others from
        # refreshing or the site from publishing. Safe because fetch_macro.py
        # refuses to overwrite when no series returned, so the previous feed
        # survives intact — and a feed that silently freezes now announces itself
        # on the page ("Feed rebuilt N days ago") instead of passing as current.
        continue-on-error: true
        run: python tools/fetch_macro.py --years 5

      - name: Fetch US Treasury supply (auctions + buybacks, keyless)
        continue-on-error: true      # a Treasury outage must not block the deploy
        run: python tools/fetch_treasury.py

      # ── FULL path only: promo scrape + summariser ───────────────────────
      - name: Install scraper deps
        if: env.FULL == 'true'
        run: |
          pip install -r tools/requirements-ci.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Scrape card promos (best-effort; keep prior feed on failure)
        if: env.FULL == 'true'
        continue-on-error: true
        # --max bounds only the promos still WITHOUT a summary, per listing (credit and
        # debit each; the credit listing alone runs 130+).
        # Any promo already summarised stays in the feed while the bank lists it.
        run: |
          python tools/scrape_campaign.py --max 15
          python tools/merge_campaign.py

      # Reads the poster + official T&C of any promo that arrived without a summary
      # and writes one straight into data/promotions.json — the step that used to be
      # the manual Console round-trip. Skips itself cleanly when ANTHROPIC_API_KEY
      # is not configured (the cards then just show the T&C link, as before), so the
      # deploy never depends on it.
      - name: Summarise new promos (skipped without ANTHROPIC_API_KEY)
        if: env.FULL == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/summarize_campaign.py

      # ── FULL path only: macro forecasting engine ────────────────────────
      # MACRO_ENGINE_REPO may be an org/name for a separate private repo; if the
      # engine lives in this same repo under "macro-engine/", drop this step and
      # point MACRO_DIR at it instead.
      - name: Check out the macro engine
        uses: actions/checkout@v4
        if: ${{ env.FULL == 'true' && vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true
        with:
          repository: ${{ vars.MACRO_ENGINE_REPO }}
          path: macro-engine
          token: ${{ secrets.MACRO_ENGINE_TOKEN || github.token }}

      - name: Cache the engine database (observations only, no vintage store)
        uses: actions/cache@v4
        if: ${{ env.FULL == 'true' && vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true
        with:
          # The database AND the fitted-model cache.
          path: |
            macro-engine/macro_engine.db
            macro-engine/data_cache
          # A miss just means `main.py daily` does a full pull instead of an
          # incremental one, which costs about two minutes.
          key: macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-${{ github.run_id }}
          restore-keys: |
            macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-
            macro-engine-db-

      - name: Run the macro engine (keyless FRED/ALFRED/BLS)
        id: engine
        # Until MACRO_ENGINE_REPO is set this is skipped entirely and the site
        # deploys with the last COMMITTED data/macro_engine.json -- a working
        # dashboard on a frozen snapshot, rather than a broken deploy.
        if: ${{ env.FULL == 'true' && vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true      # a FRED outage must not block the deploy
        working-directory: macro-engine
        env:
          # Write the feed straight into this repo's data/ directory.
          MACRO_DASHBOARD_DIR: ${{ github.workspace }}
          # New training month: score with last month's fit now, refit in the
          # `retrain` job after the deploy instead of blocking it.
          MACRO_ALLOW_STALE_MODEL: "1"
        # `main.py daily` ingests incrementally from the cached database, or the
        # full history when the database is empty, so the separate
        # `tools/backfill.py --observations` pull that used to run first was a
        # second download of the same 84 series (40-85s) and is gone. So is
        # `main.py report`, which only re-printed the snapshot to this log.
        run: |
          pip install -r requirements.txt
          python main.py daily
          if [ -f data_cache/RETRAIN_NEEDED ]; then
            echo "needs_retrain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed public feeds
        # backtest_result.json is committed from your local `main.py monthly`
        # run, not produced here — `git add` is harmless when it is unchanged.
        run: |
          bash tools/commit_feeds.sh "chore: refresh macro engine + campaign feeds" \
            data/macro.json data/promotions.json data/treasury.json \
            data/macro_engine.json data/backtest_result.json

      # Publish the dashboard, not the workspace: the engine checkout (and its
      # 66MB database + model pickle) used to ride along to Pages on every run.
      - name: Stage the site
        run: rsync -a --exclude .git --exclude macro-engine ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site   # index.html is at the repo root; klse.json is git-ignored
      - id: deploy
        uses: actions/deploy-pages@v4

  # The engine's monthly model refit, AFTER the site is live. Runs only when the
  # daily engine step scored with last month's models (it wrote RETRAIN_NEEDED).
  # It refits, saves the fresh model cache for every later run, commits the
  # refitted feed and redeploys.
  retrain:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.needs_retrain == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # the feeds build-and-deploy just pushed, not the trigger commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Check out the macro engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MACRO_ENGINE_REPO }}
          path: macro-engine
          token: ${{ secrets.MACRO_ENGINE_TOKEN || github.token }}

      - name: Restore the engine database + model cache
        uses: actions/cache@v4
        with:
          path: |
            macro-engine/macro_engine.db
            macro-engine/data_cache
          # Its own key: the run_id key above was already saved by the
          # build-and-deploy job, and an exact hit is never re-saved. The
          # restore prefix picks that just-saved entry up; the next daily run
          # then restores THIS one, the newest, with the fresh fit in it.
          key: macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-${{ github.run_id }}-retrained
          restore-keys: |
            macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-
            macro-engine-db-

      - name: Refit the models
        working-directory: macro-engine
        env:
          MACRO_DASHBOARD_DIR: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt
          python main.py daily

      - name: Commit the refitted engine feed
        run: |
          bash tools/commit_feeds.sh "chore: monthly model refit" data/macro_engine.json

      # Publish the dashboard, not the workspace: the engine checkout (and its
      # 66MB database + model pickle) used to ride along to Pages on every run.
      - name: Stage the site
        run: rsync -a --exclude .git --exclude macro-engine ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site   # index.html is at the repo root; klse.json is git-ignored
      - id: deploy
        uses: actions/deploy-pages@v4
