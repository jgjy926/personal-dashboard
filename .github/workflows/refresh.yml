name: Refresh feeds & deploy

# Runs the data fetchers on GitHub's runners (clean egress — FRED/Public Bank work
# here even where a local sandbox is blocked), commits the refreshed public feeds,
# and publishes the static dashboard to GitHub Pages. Entirely on free tiers.
#
# The Macro tab is driven by the sibling macro forecasting engine, which is
# checked out alongside this repo and run here daily. Two things make that cheap:
#
#   * The runner keeps a LIGHT database — observations only, ~55MB — in the
#     Actions cache. The 1.2M-row ALFRED vintage store (160MB of a 214MB full
#     database) is needed only to PRODUCE a backtest, never to display one, so it
#     is deliberately absent here.
#   * The backtest itself runs on your own machine when you want it
#     (`python main.py monthly`), and exports a ~25KB data/backtest_result.json
#     that IS committed. The engine reads that when the database has no summary,
#     so the published Model Performance page stays complete.
#
# Net effect: the daily job is a few minutes and the repo carries no binary blob.

on:
  workflow_dispatch:            # run manually from the Actions tab
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * *"        # daily 06:20 UTC (after US markets settle)

permissions:
  contents: write               # commit refreshed feeds back
  pages: write                  # deploy to Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deliberately a SEPARATE job, and deliberately not a dependency of the deploy
  # below. It guards the parse/merge layer the macro cards are built from — no
  # network, ~1s — and it is where the staleness bugs lived (UTC-vs-exchange
  # dating, the Reiwa-only era pattern, splicing a fast source onto a slow one).
  #
  # It does not gate the deploy for the same reason every step below carries
  # continue-on-error: one broken source must never stop the other feeds from
  # refreshing or the site from publishing. A red X here is a clear signal to fix
  # the parser; meanwhile fetch_macro.py's own "no series returned — refusing to
  # overwrite" guard is what actually protects the published feed from garbage.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p 'test_*.py' -v

  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper deps
        run: |
          pip install requests beautifulsoup4 pytesseract Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Fetch macro (FRED + Yahoo extension + Japan MoF, all keyless)
        # Matches every step below: one bad source must not stop the others from
        # refreshing or the site from publishing. Safe because fetch_macro.py
        # refuses to overwrite when no series returned, so the previous feed
        # survives intact — and a feed that silently freezes now announces itself
        # on the page ("Feed rebuilt N days ago") instead of passing as current.
        continue-on-error: true
        run: python tools/fetch_macro.py --years 5

      - name: Fetch US Treasury supply (auctions + buybacks, keyless)
        continue-on-error: true      # a Treasury outage must not block the deploy
        run: python tools/fetch_treasury.py

      - name: Scrape card promos (best-effort; keep prior feed on failure)
        continue-on-error: true
        run: |
          python tools/scrape_campaign.py --max 15
          python tools/merge_campaign.py

      # Reads the poster + official T&C of any promo that arrived without a summary
      # and writes one straight into data/promotions.json — the step that used to be
      # the manual Console round-trip. Skips itself cleanly when ANTHROPIC_API_KEY
      # is not configured (the cards then just show the T&C link, as before), so the
      # deploy never depends on it.
      - name: Summarise new promos (skipped without ANTHROPIC_API_KEY)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          python tools/summarize_campaign.py

      # ── Macro forecasting engine ────────────────────────────────────────
      # MACRO_ENGINE_REPO may be an org/name for a separate private repo; if the
      # engine lives in this same repo under "macro-engine/", drop this step and
      # point MACRO_DIR at it instead.
      - name: Check out the macro engine
        uses: actions/checkout@v4
        if: ${{ vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true
        with:
          repository: ${{ vars.MACRO_ENGINE_REPO }}
          path: macro-engine
          token: ${{ secrets.MACRO_ENGINE_TOKEN || github.token }}

      - name: Cache the engine database (observations only, no vintage store)
        uses: actions/cache@v4
        # Skips harmlessly until MACRO_ENGINE_REPO is set and the checkout above
        # has actually produced a macro-engine/ directory.
        if: ${{ vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true
        with:
          # The database AND the fitted-model cache. Without the latter, every
          # run pays a full five-model walk-forward; with it, only the first run
          # of each calendar month does.
          path: |
            macro-engine/macro_engine.db
            macro-engine/data_cache
          # Rolls monthly so the cache cannot drift stale indefinitely; a miss
          # just means the next step does a full pull instead of an incremental
          # one, which costs about two minutes.
          key: macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-${{ github.run_id }}
          restore-keys: |
            macro-engine-db-${{ hashFiles('macro-engine/config/series.py') }}-
            macro-engine-db-

      - name: Run the macro engine (keyless FRED/ALFRED/BLS)
        # Until MACRO_ENGINE_REPO is set this is skipped entirely and the site
        # deploys with the last COMMITTED data/macro_engine.json -- a working
        # dashboard on a frozen snapshot, rather than a broken deploy.
        if: ${{ vars.MACRO_ENGINE_REPO != '' }}
        continue-on-error: true      # a FRED outage must not block the deploy
        working-directory: macro-engine
        env:
          # Write the feed straight into this repo's data/ directory.
          MACRO_DASHBOARD_DIR: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt
          # Incremental when the cache restored a database; a full first-time
          # pull otherwise. Either way this is observations only — the vintage
          # backfill is never run here.
          python tools/backfill.py --observations
          python main.py daily
          python main.py report | tail -40

      - name: Commit refreshed public feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # backtest_result.json is committed from your local `main.py monthly`
          # run, not produced here — `git add` is harmless when it is unchanged.
          git add data/macro.json data/promotions.json data/treasury.json \
                  data/macro_engine.json data/backtest_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh macro engine + campaign feeds"
            # The push can race a concurrent run/commit on main (rejected: fetch
            # first). Retry with a rebase onto whatever landed, a few times,
            # instead of silently dropping this run's refreshed data.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected, retrying with rebase ($i/5)…"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; break; }
              sleep $((i * 3))
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                # index.html is at the repo root; klse.json is git-ignored
      - id: deploy
        uses: actions/deploy-pages@v4
